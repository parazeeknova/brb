name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rebuild_all:
        description: Rebuild and deploy all BRB images
        type: boolean
        default: true

concurrency:
  group: brb-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  actions: read

jobs:
  # PR CI runs the checks; publishing waits for the images, then deploys only
  # affected apps and verifies their runtime health and public web revision.
  detect:
    name: detect-changed-images
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.diff.outputs.matrix }}
      web: ${{ steps.diff.outputs.web }}
      ingest: ${{ steps.diff.outputs.ingest }}
      migrations: ${{ steps.diff.outputs.migrations }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          REBUILD_ALL: ${{ inputs.rebuild_all || false }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Compare against the last successful publish/deploy, so a replaced
          # pending concurrency run cannot skip changes from an earlier merge.
          before=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/publish.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // empty')
          sha=${{ github.sha }}
          if [[ "$REBUILD_ALL" == true || -z "$before" || "$before" == 0000* ]]; then
            # No history to diff against (fresh branch): build everything once.
            echo 'matrix={"include":[{"image":"brb-web","dockerfile":"apps/web/Dockerfile"},{"image":"brb-ingest","dockerfile":"apps/ingest/Dockerfile"},{"image":"brb-prisma-sync","dockerfile":"docker/prisma-sync.dockerfile"}]}' >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
            echo "ingest=true" >> "$GITHUB_OUTPUT"
            echo "migrations=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$before" "$sha")
          echo "changed files:"; echo "$files"
          has() { echo "$files" | grep -qE "$1"; }
          # True only when uv.lock changed beyond the routine root-version sync
          # the version manager performs on every commit (that line alone must
          # NOT rebuild the python images). Compares the resolved third-party
          # package sets, ignoring the virtual root project itself.
          uv_real_change() {
            if ! git show "$before":uv.lock > /tmp/uv-old.lock 2>/dev/null; then
              return 0
            fi
            python3 - "$PWD/uv.lock" /tmp/uv-old.lock <<'EOF'
          import sys, tomllib
          def pkgs(p):
              with open(p, "rb") as f:
                  d = tomllib.load(f)
              return {pkg["name"]: pkg.get("version") for pkg in d.get("package", []) if pkg.get("source") != {"virtual": "."}}
          sys.exit(0 if pkgs(sys.argv[1]) != pkgs(sys.argv[2]) else 1)
          EOF
          }
          web=false; ingest=false; migrations=false
          if has '^(scripts/ci/|\.github/workflows/publish.yml|\.dockerignore)'; then web=true; ingest=true; fi
          if has '^packages/db/'; then web=true; fi
          if has '^apps/web/'; then web=true; fi
          if has '^apps/ingest/'; then ingest=true; fi
          # bun.lock carries no project versions (only dep ranges), so any
          # change there is a real dependency change for the web image.
          if git diff --name-only "$before" "$sha" -- bun.lock | grep -q .; then
            web=true
          fi
          if git diff --name-only "$before" "$sha" -- uv.lock | grep -q .; then
            if uv_real_change; then
              ingest=true
            fi
          fi
          # Like ASM, every app rollout checks schema readiness, even on an
          # apps-only merge after a previous migration deployment failed.
          if $web || $ingest || has '^(packages/db/|docker/prisma-sync\.dockerfile|bun\.lock)'; then migrations=true; fi
          echo "migrations=$migrations" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "ingest=$ingest" >> "$GITHUB_OUTPUT"
          entries=""
          if $web; then entries="$entries{\"image\":\"brb-web\",\"dockerfile\":\"apps/web/Dockerfile\"},"; fi
          if $ingest; then entries="$entries{\"image\":\"brb-ingest\",\"dockerfile\":\"apps/ingest/Dockerfile\"},"; fi
          if $migrations; then entries="$entries{\"image\":\"brb-prisma-sync\",\"dockerfile\":\"docker/prisma-sync.dockerfile\"},"; fi
          echo "matrix={\"include\":[${entries%,}]}" >> "$GITHUB_OUTPUT"

  build:
    name: build+push ${{ matrix.image }}
    needs: detect
    if: needs.detect.outputs.matrix != '{"include":[]}'
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify Dokploy access before building
        env:
          DOKPLOY_API_URL: ${{ secrets.DOKPLOY_API_URL }}
          DOKPLOY_API_TOKEN: ${{ secrets.DOKPLOY_API_TOKEN }}
          DOKPLOY_PROJECT_ID: ${{ secrets.DOKPLOY_PROJECT_ID }}
          DOKPLOY_WEB_APP_ID: ${{ secrets.DOKPLOY_WEB_APP_ID }}
          DOKPLOY_INGEST_APP_ID: ${{ secrets.DOKPLOY_INGEST_APP_ID }}
          DOKPLOY_PRISMA_APP_ID: ${{ secrets.DOKPLOY_PRISMA_APP_ID }}
        run: python3 scripts/ci/dokploy_deploy.py --check
      - id: repo
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: VITE_RELEASE_SHA=${{ github.sha }}
          # Per-image scoped cache: unchanged layers (deps, browsers) restore
          # in seconds; only the layers after changed files rebuild.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          tags: |
            ghcr.io/${{ steps.repo.outputs.owner }}/${{ matrix.image }}:latest
            ghcr.io/${{ steps.repo.outputs.owner }}/${{ matrix.image }}:sha-${{ github.sha }}

  deploy:
    name: deploy-production
    needs: [detect, build]
    if: >-
      always() && github.ref == 'refs/heads/main' && needs.detect.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') && (needs.detect.outputs.web == 'true' || needs.detect.outputs.ingest == 'true' || needs.detect.outputs.migrations == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Deploy published images and verify landing revision
        env:
          DOKPLOY_API_URL: ${{ secrets.DOKPLOY_API_URL }}
          DOKPLOY_API_TOKEN: ${{ secrets.DOKPLOY_API_TOKEN }}
          DOKPLOY_PROJECT_ID: ${{ secrets.DOKPLOY_PROJECT_ID }}
          DOKPLOY_WEB_APP_ID: ${{ secrets.DOKPLOY_WEB_APP_ID }}
          DOKPLOY_INGEST_APP_ID: ${{ secrets.DOKPLOY_INGEST_APP_ID }}
          DOKPLOY_PRISMA_APP_ID: ${{ secrets.DOKPLOY_PRISMA_APP_ID }}
          BRB_WEB_URL: ${{ secrets.BRB_WEB_URL }}
          DEPLOY_WEB: ${{ needs.detect.outputs.web }}
          DEPLOY_MIGRATIONS: ${{ needs.detect.outputs.migrations }}
          DEPLOY_INGEST: ${{ needs.detect.outputs.ingest }}
        run: |
          args=()
          if [[ "$DEPLOY_MIGRATIONS" == true ]]; then args+=(--migrations); fi
          if [[ "$DEPLOY_WEB" == true ]]; then args+=(--web); fi
          if [[ "$DEPLOY_INGEST" == true ]]; then args+=(--ingest); fi
          python3 scripts/ci/dokploy_deploy.py "${args[@]}"
